<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des utilisateurs</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            max-width: 500px;
            margin: auto;
            margin-top: 50px;
        }
        #user-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #user-list li button {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="card shadow">
    <div class="card-body">
        <h2 class="card-title text-center mb-4">Gestion des utilisateurs</h2>

        <div id="message"></div>

        <form id="user-form" class="mb-4">
            <div class="mb-3">
                <input type="text" id="prenom" placeholder="Prénom" class="form-control" required>
            </div>
            <div class="mb-3">
                <input type="text" id="nom" placeholder="Nom" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ajouter</button>
        </form>

        <ul id="user-list" class="list-group"></ul>
    </div>
</div>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
